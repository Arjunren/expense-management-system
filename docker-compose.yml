services:
  db:
    image: postgres:17-alpine
    environment: { POSTGRES_DB: expenses, POSTGRES_USER: expenses, POSTGRES_PASSWORD: expenses }
    healthcheck: { test: ["CMD-SHELL", "pg_isready -U expenses"], interval: 5s, timeout: 5s, retries: 10 }
    volumes: [expense_data:/var/lib/postgresql/data]
  api:
    build: .
    environment:
      DATABASE_URL: postgresql+psycopg://expenses:expenses@db:5432/expenses
      JWT_SECRET: local-development-secret-change-me-1234
      ALLOWED_ORIGINS: http://localhost:3000
    ports: ["8000:8000"]
    depends_on: { db: { condition: service_healthy } }
  migrate:
    build: .
    command: ["python", "-m", "app.migrate"]
    environment: { DATABASE_URL: postgresql+psycopg://expenses:expenses@db:5432/expenses, JWT_SECRET: local-development-secret-change-me-1234 }
    depends_on: { db: { condition: service_healthy } }
    profiles: [tools]
  seed:
    build: .
    command: ["python", "-m", "app.seed"]
    environment: { DATABASE_URL: postgresql+psycopg://expenses:expenses@db:5432/expenses, JWT_SECRET: local-development-secret-change-me-1234 }
    depends_on: { db: { condition: service_healthy } }
    profiles: [tools]
volumes: { expense_data: {} }

