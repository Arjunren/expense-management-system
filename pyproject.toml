[build-system]
requires = ["setuptools>=80"]
build-backend = "setuptools.build_meta"

[project]
name = "expense-management-system"
version = "1.0.0"
description = "Secure FastAPI expense and budget management API"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.116,<1", "uvicorn[standard]>=0.35,<1", "SQLAlchemy>=2.0,<3",
  "psycopg[binary]>=3.2,<4", "pydantic-settings>=2.10,<3", "PyJWT>=2.10,<3",
  "pwdlib[argon2]>=0.2,<1", "email-validator>=2.2,<3"
]

[project.optional-dependencies]
dev = ["pytest>=8.4,<10", "httpx>=0.28,<1", "ruff>=0.12,<1", "pip-audit>=2.9,<3"]

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff.lint]
select = ["E9", "F"]

